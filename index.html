
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahenda Khaled Magdy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            color: #d4af37;
            letter-spacing: 3px;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .hero p {
            color: #d4af37;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(32px, 8vw, 60px);
            margin-bottom: 20px;
        }

        .description {
            color: #cccccc;
            line-height: 1.8;
            max-width: 500px;
        }

        .line {
            width: 100px;
            height: 3px;
            background: #d4af37;
            margin: 30px auto;
        }

        footer {
            padding: 25px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header>PORTFOLIO</header>

    <main class="hero">
        <p>WELCOME TO MY WORLD</p>
        <h1>Shahenda<br>Khaled Magdy</h1>
        <div class="line"></div>
        <div class="description">
            A little space that represents me, my journey,
            my dreams, and everything I aspire to become.
        </div>
    </main>

    <footer>© 2026 Shahenda Khaled Magdy</footer>
</body>
</html>
